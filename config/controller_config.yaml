controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true
    controllers:
      diff_drive_controller:
        type: diff_drive_controller/DiffDriveController
        left_wheel: "left_wheel_joint"
        right_wheel: "right_wheel_joint"
        publish_rate: 50
        wheel_separation: 0.3
        wheel_radius: 0.05
        cmd_vel_timeout: 0.5
        velocity_rolling_window_size: 2